AWSTemplateFormatVersion: '2010-09-09'
Description: '1-Click deployment of FindIt Campus Lost and Found on AWS EC2 (Ubuntu 24.04)'

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t2.micro
      - t3.small
      - t3.nano
    Description: EC2 Instance Type (t3.micro is the Free Tier eligible type in modern AWS accounts/regions)
  AmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
    Description: Official Ubuntu 24.04 LTS AMI resolved dynamically by AWS for your region
  KeyName:
    Type: String
    Default: ''
    Description: (Optional) Name of an existing EC2 KeyPair to enable SSH access

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  FindItSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP, HTTPS, and SSH access for FindIt
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  FindItInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      SecurityGroupIds:
        - !Ref FindItSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y build-essential git sqlite3 libsqlite3-dev nginx curl

          # Clone repo as ubuntu user
          su - ubuntu -c "git clone https://github.com/tomorrowlord03/FindIt.git /home/ubuntu/FindIt"
          su - ubuntu -c "cd /home/ubuntu/FindIt/server/cpp && g++ -std=c++17 -O2 -o findit-server main.cpp -lsqlite3 -lpthread -ldl"

          # Setup systemd
          cp /home/ubuntu/FindIt/deploy/findit.service /etc/systemd/system/findit.service
          systemctl daemon-reload
          systemctl enable --now findit

          # Setup nginx
          cp /home/ubuntu/FindIt/deploy/nginx-findit.conf /etc/nginx/sites-available/default
          systemctl restart nginx

      Tags:
        - Key: Name
          Value: FindIt-Production-Server

Outputs:
  WebsiteURL:
    Description: Public URL of the FindIt campus lost and found application
    Value: !Sub 'http://${FindItInstance.PublicIp}'
  PublicIP:
    Description: Public IPv4 Address
    Value: !GetAtt FindItInstance.PublicIp
